# Enable the Lily58's built-in SSD1306 OLED display
CONFIG_ZMK_DISPLAY=y

# Show the active layer's name on the OLED (only appears when a layer
# other than the base layer is held/toggled on)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable mouse key emulation (&mkp / &mmv / &msc) used on the RAISE layer
CONFIG_ZMK_POINTING=y

# Bluetooth advertised name (max 16 chars)
CONFIG_ZMK_KEYBOARD_NAME="Lily58"

# Deep sleep after 30 min idle to save battery (wireless nRF52840)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
